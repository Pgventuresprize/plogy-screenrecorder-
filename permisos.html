<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Plogy Screen Recorder · micrófono</title>
    <link rel="icon" href="assets/icono-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" />
    <style>
      :root {
        --ink: #171310;
        --muted: #625951;
        --orange: #ff5b00;
        --focus: #5b286b;
        --display: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
        --body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font: 16px/1.6 var(--body);
        color: var(--ink);
        background:
          radial-gradient(ellipse at 88% 15%, #f759465c, transparent 55%),
          radial-gradient(ellipse at 10% 95%, #9c5aa74d, transparent 60%),
          #fff;
      }
      main {
        width: 100%;
        max-width: 460px;
        padding: 36px 32px;
        border-radius: 28px;
        border: 1px solid #ffffffd9;
        background: linear-gradient(125deg, #ffffffbf, #ffffff70);
        backdrop-filter: blur(24px) saturate(125%);
        box-shadow: 0 16px 45px #7b300f14, inset 0 1px 0 #ffffff9c;
      }
      img { height: 60px; margin: -10px 0 14px -20px; display: block; }
      .eyebrow { font-size: 12px; font-weight: 500; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
      h1 { font: 700 32px/1.12 var(--display); letter-spacing: -.035em; margin: 0 0 12px; }
      p { color: #48433f; margin: 0 0 24px; }
      button {
        min-height: 48px;
        padding: 14px 26px;
        border: 0;
        border-radius: 999px;
        font: 700 15px var(--display);
        color: var(--ink);
        background: var(--orange);
        box-shadow: inset 0 1px 0 #ffffff45;
        cursor: pointer;
        transition: transform .18s, box-shadow .18s;
      }
      button:hover { transform: translateY(-2px); box-shadow: 0 8px 22px #2110081f; }
      button:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
      #estado { margin: 20px 0 0; font-size: 14px; }
      #estado:empty { display: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/plogy.svg" alt="Plogy" />
      <p class="eyebrow">Screen Recorder</p>
      <h1>Activa tu micrófono</h1>
      <p>Para que tu voz quede en la grabación, el navegador necesita tu permiso una sola vez.</p>
      <button id="permitir">Permitir micrófono</button>
      <p id="estado"></p>
    </main>
    <script src="permisos.js"></script>
  </body>
</html>
